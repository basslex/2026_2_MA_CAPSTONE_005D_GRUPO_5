
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Crea tu cuenta Essenzia y guarda tus fragancias favoritas."
    >

    <title>Crear cuenta | Essenzia</title>

    <link
        rel="stylesheet"
        href="../../css/auth.css"
    >

    <script
        type="module"
        src="../../js/auth.js"
    ></script>
</head>

<body>

    <header class="auth-header">
        <a
            href="../../index.html"
            aria-label="Volver a Essenzia"
        >
            <img
                src="../../img/logo-essenzia.jpg"
                alt="Essenzia"
                class="auth-logo"
            >
        </a>
    </header>

    <main class="auth-main">

        <section class="auth-card">

            <span class="auth-eyebrow">
                FORMA PARTE DE ESSENZIA
            </span>

            <h1>Crea tu cuenta</h1>

            <p class="auth-description">
                Regístrate para guardar tus perfumes
                favoritos y crear tu lista de deseos.
            </p>

            <form
                id="registro-form"
                class="auth-form"
            >

                <label for="registro-nombre">
                    Nombre completo
                </label>

                <input
                    type="text"
                    id="registro-nombre"
                    name="nombre"
                    placeholder="Tu nombre completo"
                    autocomplete="name"
                    minlength="2"
                    maxlength="100"
                    required
                >

                <label for="registro-email">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="registro-email"
                    name="email"
                    placeholder="correo@ejemplo.com"
                    autocomplete="email"
                    maxlength="254"
                    required
                >

                <label for="registro-password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="registro-password"
                    name="password"
                    placeholder="Mínimo 12 caracteres"
                    autocomplete="new-password"
                    minlength="12"
                    required
                >

                <label for="registro-confirmar">
                    Confirmar contraseña
                </label>

                <input
                    type="password"
                    id="registro-confirmar"
                    name="confirmar"
                    placeholder="Repite tu contraseña"
                    autocomplete="new-password"
                    minlength="12"
                    required
                >

                <p
                    id="auth-message"
                    class="auth-message"
                    role="status"
                    aria-live="polite"
                ></p>

                <button
                    type="submit"
                    class="auth-button"
                >
                    Crear cuenta
                </button>

            </form>

            <p class="auth-switch">
                ¿Ya tienes una cuenta?
                <a href="./login.html">
                    Inicia sesión
                </a>
            </p>

            <div class="auth-divider">
                <span>O CONTINÚA EXPLORANDO</span>
            </div>

            <a
                href="../../index.html"
                class="auth-guest"
            >
                Continuar como invitado →
            </a>

        </section>

    </main>

    <footer class="auth-footer">
        © 2026 Essenzia · Perfumería de autor
    </footer>

</body>
</html>
